<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Farm</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #060b14;
      --surface-1: rgba(255,255,255,0.03);
      --surface-2: rgba(255,255,255,0.055);
      --surface-3: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.07);
      --border-accent: rgba(99,179,237,0.25);
      --text: #e8f0fc;
      --text-2: #7f9bbf;
      --text-3: #4a6080;
      --accent: #63b3ed;
      --accent-glow: rgba(99,179,237,0.15);
      --green: #68d391;
      --green-glow: rgba(104,211,145,0.15);
      --red: #fc8181;
      --red-glow: rgba(252,129,129,0.15);
      --yellow: #f6e05e;
      --yellow-glow: rgba(246,224,94,0.12);
      --cyan: #76e4f7;
      --radius: 16px;
      --radius-sm: 10px;
      --glass: blur(20px) saturate(160%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: radial-gradient(ellipse at 10% 0%, rgba(37,99,235,0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 90% 10%, rgba(14,165,233,0.08) 0%, transparent 45%),
                  radial-gradient(ellipse at 50% 90%, rgba(79,70,229,0.07) 0%, transparent 45%),
                  #060b14;
    }
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0z' fill='none'/%3E%3Ccircle cx='1' cy='1' r='0.5' fill='rgba(255,255,255,0.015)'/%3E%3C/svg%3E") repeat;
      pointer-events: none;
    }

    /* ── Layout ── */
    .app {
      position: relative; z-index: 1;
      display: flex; height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 6px;
      padding: 20px 12px;
      background: rgba(6,11,20,0.7);
      border-right: 1px solid var(--border);
      backdrop-filter: var(--glass);
      overflow-y: auto;
    }

    .brand {
      padding: 14px 10px 18px;
      margin-bottom: 4px;
    }
    .brand-name {
      font-size: 15px; font-weight: 800; letter-spacing: 0.02em;
      color: var(--text);
    }
    .brand-name span {
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand-sub {
      font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.4;
    }

    .nav-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      color: var(--text-3); text-transform: uppercase;
      padding: 0 10px; margin-top: 10px; margin-bottom: 4px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 9px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-2);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .nav-item:hover {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border);
    }
    .nav-item.active {
      color: var(--accent);
      background: rgba(99,179,237,0.08);
      border-color: rgba(99,179,237,0.18);
    }
    .nav-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px; flex-shrink: 0;
    }
    .nav-item.active .nav-icon {
      background: rgba(99,179,237,0.12);
      border-color: rgba(99,179,237,0.2);
    }

    /* ── Content ── */
    .content {
      flex: 1; min-width: 0;
      overflow-y: auto;
      padding: 22px 24px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .page { animation: fadeUp 0.2s ease; display: contents; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page header ── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
      padding: 16px 20px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: var(--glass);
    }
    .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .page-sub { font-size: 12px; color: var(--text-2); margin-top: 3px; line-height: 1.5; }
    .header-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    /* ── Glass card ── */
    .card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: var(--glass);
      padding: 18px;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    }
    .card-title {
      font-size: 13px; font-weight: 700; letter-spacing: 0.01em;
      margin-bottom: 14px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .card-title-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }

    /* ── Stats grid ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-card {
      padding: 16px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: var(--glass);
      position: relative; overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute; right: -16px; top: -16px;
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      pointer-events: none;
    }
    .stat-card.green::after { background: radial-gradient(circle, var(--green-glow), transparent 70%); }
    .stat-card.red::after   { background: radial-gradient(circle, var(--red-glow),   transparent 70%); }
    .stat-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-3); margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px; font-weight: 800; letter-spacing: -0.03em;
    }
    .stat-value.blue   { color: var(--accent); }
    .stat-value.green  { color: var(--green);  }
    .stat-value.red    { color: var(--red);    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--surface-3);
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }

    .btn.primary {
      background: linear-gradient(135deg, rgba(37,99,235,0.85), rgba(14,165,233,0.7));
      border-color: rgba(99,179,237,0.3);
      color: #fff;
      box-shadow: 0 4px 16px rgba(37,99,235,0.2);
    }
    .btn.primary:hover {
      box-shadow: 0 6px 22px rgba(37,99,235,0.3), 0 0 20px rgba(99,179,237,0.12);
    }
    .btn.success {
      background: linear-gradient(135deg, rgba(16,185,129,0.8), rgba(52,211,153,0.65));
      border-color: rgba(104,211,145,0.3);
      color: #f0fff4;
      box-shadow: 0 4px 14px rgba(16,185,129,0.15);
    }
    .btn.danger {
      background: linear-gradient(135deg, rgba(220,38,38,0.8), rgba(252,129,129,0.65));
      border-color: rgba(252,129,129,0.3);
      color: #fff5f5;
      box-shadow: 0 4px 14px rgba(220,38,38,0.15);
    }
    .btn.ghost {
      background: transparent;
      color: var(--text-2);
    }
    .btn.ghost:hover { color: var(--text); background: var(--surface-2); }
    .btn.sm { padding: 6px 10px; font-size: 11px; border-radius: 8px; }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      border: 1px solid transparent;
    }
    .badge.ok     { color: var(--green);  background: rgba(104,211,145,0.1); border-color: rgba(104,211,145,0.2); }
    .badge.warn   { color: var(--yellow); background: rgba(246,224,94,0.1);  border-color: rgba(246,224,94,0.2);  }
    .badge.danger { color: var(--red);    background: rgba(252,129,129,0.1); border-color: rgba(252,129,129,0.2); }
    .badge.info   { color: var(--accent); background: rgba(99,179,237,0.1);  border-color: rgba(99,179,237,0.2);  }
    .badge.neutral{ color: var(--text-2); background: var(--surface-2);      border-color: var(--border);          }
    .badge.running {
      color: var(--cyan); background: rgba(118,228,247,0.1); border-color: rgba(118,228,247,0.25);
    }
    .badge.running::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 0 rgba(118,228,247,0.5);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(118,228,247,0.5); }
      70%  { box-shadow: 0 0 0 6px rgba(118,228,247,0); }
      100% { box-shadow: 0 0 0 0 rgba(118,228,247,0); }
    }

    /* ── Two-col layout ── */
    .two-col { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 16px; align-items: start; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    .table-head, .table-row {
      display: grid;
      grid-template-columns: 1.7fr 1.1fr 1.2fr 0.5fr 0.8fr 1fr 0.9fr auto;
      gap: 10px; align-items: center;
      min-width: 1060px;
    }
    .table-head {
      padding: 8px 12px 12px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-3);
    }
    .table-row {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-1);
      margin-bottom: 8px;
      transition: border-color 0.15s, transform 0.15s;
    }
    .table-row:hover {
      border-color: rgba(99,179,237,0.18);
      transform: translateY(-1px);
    }
    .cell-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .cell-sub   { font-size: 11px; color: var(--text-2); }

    /* ── Mini stats ── */
    .mini-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin: 12px 0;
    }
    .mini-stat {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }
    .mini-stat .ms-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 4px;
    }
    .mini-stat .ms-value { font-size: 17px; font-weight: 800; }

    /* ── Account card ── */
    .account-card {
      /* inherits .card */
    }
    .account-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 8px;
    }
    .account-name { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
    .account-phone { font-size: 11px; color: var(--text-2); }
    .error-box {
      margin: 10px 0; padding: 9px 11px;
      border-radius: 10px;
      background: rgba(252,129,129,0.06);
      border: 1px solid rgba(252,129,129,0.16);
      color: #fca5a5; font-size: 12px; line-height: 1.4;
    }
    .action-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .action-row.right { justify-content: flex-end; margin-top: 0; }

    /* ── Cards grid ── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

    /* ── Forms ── */
    .field { display: grid; gap: 6px; margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 700; color: var(--text-2); }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-2col .full { grid-column: 1 / -1; }

    input, select, textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(99,179,237,0.45);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.1);
    }
    textarea {
      min-height: 160px; resize: vertical;
      font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
    }
    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .checkbox-row input { width: auto; accent-color: var(--accent); }

    /* ── Toolbar ── */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .toolbar .spacer { flex: 1; }

    /* ── Divider ── */
    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 14px 0; }

    /* ── Log list ── */
    .log-list { display: grid; gap: 6px; max-height: 540px; overflow-y: auto; padding-right: 4px; }
    .log-item {
      display: grid; grid-template-columns: 130px 82px 1fr;
      gap: 8px; align-items: start;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0,0,0,0.15);
      font-size: 12px; line-height: 1.45;
    }
    .log-ts   { color: var(--text-3); font-variant-numeric: tabular-nums; }
    .log-msg  { word-break: break-word; white-space: pre-wrap; }
    .log-meta { font-size: 11px; color: var(--text-3); margin-top: 3px; }

    /* ── Empty state ── */
    .empty {
      padding: 24px; text-align: center;
      color: var(--text-3); font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* ── Notice ── */
    .notice {
      padding: 11px 13px;
      border-radius: 10px;
      background: rgba(99,179,237,0.06);
      border: 1px solid rgba(99,179,237,0.12);
      color: #bee3f8; font-size: 12px; line-height: 1.55;
    }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 100;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: min(860px, 100%); max-height: 90vh; overflow-y: auto;
      background: rgba(8,14,28,0.96);
      border: 1px solid var(--border-accent);
      border-radius: 20px; padding: 22px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      animation: modalIn 0.18s ease;
      backdrop-filter: blur(30px);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em; }
    .modal-sub { font-size: 12px; color: var(--text-2); margin-bottom: 16px; line-height: 1.5; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* ── Toast ── */
    .toast-root {
      position: fixed; right: 16px; bottom: 16px;
      display: grid; gap: 8px; z-index: 200;
      max-width: min(380px, calc(100vw - 32px));
    }
    .toast {
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(8,14,28,0.95);
      backdrop-filter: blur(20px);
      font-size: 13px; font-weight: 700;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      animation: toastIn 0.16s ease;
    }
    @keyframes toastIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .toast.success { border-color: rgba(104,211,145,0.25); }
    .toast.error   { border-color: rgba(252,129,129,0.25); }
    .toast.warning { border-color: rgba(246,224,94,0.25); }
    .toast.info    { border-color: rgba(99,179,237,0.25); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      html, body { overflow: auto; }
      .app { flex-direction: column; height: auto; }
      .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 12px; }
      .brand { padding: 6px 8px; }
      .nav-label { display: none; }
      .content { padding: 12px; overflow: visible; }
    }
    @media (max-width: 540px) {
      .stats-row { grid-template-columns: 1fr; }
      .page-title { font-size: 17px; }
      .form-2col { grid-template-columns: 1fr; }
      .log-item { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name"><span>Click Farm</span></div>
        <div class="brand-sub">Telegram mini-game automation</div>
      </div>
      <div class="nav-label">Navigation</div>
      <button class="nav-item" data-page="dashboard" onclick="showPage('dashboard')">
        <span class="nav-icon">◈</span> Dashboard
      </button>
      <button class="nav-item" data-page="accounts" onclick="showPage('accounts')">
        <span class="nav-icon">◎</span> Accounts
      </button>
      <button class="nav-item" data-page="tasks" onclick="showPage('tasks')">
        <span class="nav-icon">⚡</span> Tasks
      </button>
      <button class="nav-item" data-page="logs" onclick="showPage('logs')">
        <span class="nav-icon">☰</span> Logs
      </button>
      <button class="nav-item" data-page="settings" onclick="showPage('settings')">
        <span class="nav-icon">✦</span> Settings
      </button>
    </aside>

    <main class="content">
      <div id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script>
    const state = {
      accounts: [], configs: [], logs: [], server_time: "",
      currentPage: "dashboard", currentAccountId: null,
      ui: { paused: false, editingConfigId: null, taskAccountFilter: "all", logLevel: "all", logAccount: "all" }
    };
    let pollTimer = null;

    function getSettings() {
      const raw = Number(localStorage.getItem("click_farm_poll_ms") || 3000);
      return { pollMs: Math.max(1500, Math.min(15000, raw || 3000)) };
    }
    function saveSettings(e) {
      e.preventDefault();
      const pollMs = Number(e.target.poll_ms.value || 3000);
      localStorage.setItem("click_farm_poll_ms", String(pollMs));
      startPolling(); toast("Settings saved", "success");
    }
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (!state.ui.paused) refreshState(); }, getSettings().pollMs);
    }

    async function api(path, method = "GET", body) {
      const opts = { method, headers: {} };
      if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
      const res = await fetch(path, opts);
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok || data.ok === false) throw new Error(data.error || `Request failed ${res.status}`);
      return data;
    }

    async function refreshState() {
      try {
        const data = await api("/api/state");
        state.accounts = data.accounts || [];
        state.configs  = data.configs  || [];
        state.logs     = data.logs     || [];
        state.server_time = data.server_time || "";
        if (!state.ui.paused) render();
      } catch (err) { console.error(err); }
    }

    function esc(v) {
      return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
    }
    function fmt(v) { return v || "—"; }
    function accountName(id) { const a = state.accounts.find(x=>x.id===id); return a ? a.name : id; }
    function configName(id)  { const c = state.configs.find(x=>x.id===id);  return c ? c.name : id; }

    function toast(msg, type="info") {
      const root = document.getElementById("toast-root");
      const el = document.createElement("div");
      el.className = `toast ${type}`; el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => { el.style.transition="all 0.18s"; el.style.opacity="0"; el.style.transform="translateY(6px)"; setTimeout(()=>el.remove(),180); }, 3200);
    }

    function showPage(page) {
      state.currentPage = page;
      if (page !== "account") state.currentAccountId = null;
      render();
    }
    function openAccountDetail(id) { state.currentAccountId = id; state.currentPage = "account"; render(); }

    function renderSidebar() {
      document.querySelectorAll(".nav-item").forEach(el => {
        const p = el.dataset.page;
        el.classList.toggle("active", p === state.currentPage || (p === "accounts" && state.currentPage === "account"));
      });
    }

    function render() {
      renderSidebar();
      const el = document.getElementById("content");
      const map = { dashboard: dashboardHtml, accounts: accountsHtml, account: accountDetailHtml, tasks: tasksHtml, logs: logsHtml, settings: settingsHtml };
      el.innerHTML = `<div class="page">${(map[state.currentPage] || dashboardHtml)()}</div>`;
    }

    // ── Status helpers ──
    function accountStatusBadge(status) {
      const map = { authorized:"ok", disconnected:"neutral", awaiting_code:"warn", awaiting_password:"warn", connecting:"info", error:"danger" };
      return `<span class="badge ${map[status]||"neutral"}">${esc(status||"unknown")}</span>`;
    }
    function levelBadge(level) {
      const s = String(level||"info").toLowerCase();
      const map = { error:"danger", warning:"warn", success:"ok", info:"info" };
      return `<span class="badge ${map[s]||"info"}">${esc(s)}</span>`;
    }
    function taskStateBadge(cfg) {
      const running = Boolean(cfg.task_running);
      const ts = cfg.task_state || (running ? "running" : "stopped");
      if (running || ts==="running") return `<span class="badge running">Running</span>`;
      if (ts==="starting")    return `<span class="badge info">Starting</span>`;
      if (ts==="idle")        return `<span class="badge ok">Idle</span>`;
      if (ts==="flood_wait")  return `<span class="badge warn">Flood Wait</span>`;
      if (ts==="error")       return `<span class="badge danger">Error</span>`;
      if (ts==="stopping")    return `<span class="badge warn">Stopping</span>`;
      return `<span class="badge neutral">Stopped</span>`;
    }
    function accountOptions(sel, includeAll=false, allLabel="All Accounts") {
      let h = "";
      if (includeAll) h += `<option value="all" ${sel==="all"?"selected":""}>— ${esc(allLabel)}</option>`;
      for (const a of state.accounts) h += `<option value="${esc(a.id)}" ${a.id===sel?"selected":""}>${esc(a.name)} (${esc(a.phone)})</option>`;
      return h;
    }
    function sortedConfigs() {
      return [...state.configs].sort((a,b)=>{
        const la=`${accountName(a.account_id)} ${a.name||""}`.toLowerCase();
        const lb=`${accountName(b.account_id)} ${b.name||""}`.toLowerCase();
        return la.localeCompare(lb);
      });
    }
    function emptyMsg(text) { return `<div class="empty">${esc(text)}</div>`; }

    // ── Dashboard ──
    function dashboardHtml() {
      const authAccounts = state.accounts.filter(a=>a.status==="authorized").length;
      const totalTasks = state.configs.length;
      const runningTasks = state.configs.filter(c=>c.task_running).length;
      const errorTotal = state.configs.reduce((s,c)=>s+Number(c.error_count||0),0);
      const successTotal = state.configs.reduce((s,c)=>s+Number(c.success_count||0),0);
      const recentLogs = state.logs.slice(0,8);
      const recentAccounts = state.accounts.slice(0,5);
      return `
        <div class="page-header">
          <div>
            <div class="page-title">Dashboard</div>
            <div class="page-sub">Server time: ${esc(fmt(state.server_time))}</div>
          </div>
          <div class="header-actions">
            <button class="btn primary" onclick="openAddAccountModal()">Add Account</button>
            <button class="btn" onclick="openTaskModal()">Add Task</button>
            <button class="btn success" onclick="startAll()">▶ Start All</button>
            <button class="btn danger" onclick="stopAll()">■ Stop All</button>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Authorized Accounts</div>
            <div class="stat-value blue">${authAccounts}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Saved Tasks</div>
            <div class="stat-value">${totalTasks}</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">Running Tasks</div>
            <div class="stat-value green">${runningTasks}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Errors</div>
            <div class="stat-value red">${errorTotal}</div>
          </div>
        </div>

        <div class="two-col">
          <div class="card">
            <div class="card-title"><span class="card-title-dot"></span>Accounts</div>
            ${recentAccounts.length ? `<div style="display:grid;gap:8px;">${recentAccounts.map(a=>`
              <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;border:1px solid var(--border);">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:13px;font-weight:700;">${esc(a.name)}</div>
                  <div style="font-size:11px;color:var(--text-2);">${esc(a.phone)}</div>
                </div>
                ${accountStatusBadge(a.status)}
                <button class="btn sm ghost" onclick="openAccountDetail('${a.id}')">Open</button>
              </div>`).join("")}</div>` : emptyMsg("No accounts yet.")}
          </div>
          <div class="card">
            <div class="card-title"><span class="card-title-dot" style="background:var(--cyan)"></span>Recent Activity</div>
            <div class="log-list" style="max-height:280px;">
              ${recentLogs.length ? recentLogs.map(logItemHtml).join("") : emptyMsg("No activity yet.")}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="card-title-dot" style="background:var(--green)"></span>Execution Summary</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
            <div class="mini-stat"><div class="ms-label">Successes</div><div class="ms-value" style="color:var(--green);">${successTotal}</div></div>
            <div class="mini-stat"><div class="ms-label">Warnings</div><div class="ms-value" style="color:var(--yellow);">${state.configs.reduce((s,c)=>s+Number(c.warning_count||0),0)}</div></div>
            <div class="mini-stat"><div class="ms-label">Errors</div><div class="ms-value" style="color:var(--red);">${errorTotal}</div></div>
          </div>
          <div class="notice" style="margin-top:12px;">Tasks run as isolated parallel loops. If Telegram returns a flood limit, only the affected account is paused while the rest keep running.</div>
        </div>
      `;
    }

    // ── Accounts ──
    function accountCardHtml(account) {
      const specialBtns = [];
      if (account.status==="awaiting_code")     specialBtns.push(`<button class="btn primary sm" onclick="openCodeModal('${account.id}')">Enter Code</button>`);
      if (account.status==="awaiting_password") specialBtns.push(`<button class="btn primary sm" onclick="openPasswordModal('${account.id}')">Enter Password</button>`);
      const ac = state.configs.filter(c=>c.account_id===account.id);
      return `
        <div class="card account-card">
          <div class="account-top">
            <div>
              <div class="account-name">${esc(account.name)}</div>
              <div class="account-phone">${esc(account.phone)}</div>
            </div>
            ${accountStatusBadge(account.status)}
          </div>
          <div class="mini-stats">
            <div class="mini-stat"><div class="ms-label">Tasks</div><div class="ms-value">${account.configs_count??0}</div></div>
            <div class="mini-stat"><div class="ms-label">Running</div><div class="ms-value" style="color:var(--cyan);">${account.running_count??0}</div></div>
            <div class="mini-stat"><div class="ms-label">Session</div><div class="ms-value" style="font-size:13px;">${account.has_session?"Saved":"None"}</div></div>
          </div>
          ${account.error ? `<div class="error-box">${esc(account.error)}</div>` : ""}
          <div class="action-row">
            ${specialBtns.join("")}
            <button class="btn sm" onclick="openAccountDetail('${account.id}')">Details</button>
            <button class="btn sm success" onclick="startAll('${account.id}')">▶ Start</button>
            <button class="btn sm danger" onclick="stopAll('${account.id}')">■ Stop</button>
            <button class="btn sm ghost" onclick="refreshAccount('${account.id}')">Refresh</button>
            <button class="btn sm danger" onclick="removeAccount('${account.id}')">Remove</button>
          </div>
        </div>`;
    }

    function accountsHtml() {
      return `
        <div class="page-header">
          <div>
            <div class="page-title">Accounts</div>
            <div class="page-sub">Each Telegram account has its own isolated tasks and logs.</div>
          </div>
          <div class="header-actions">
            <button class="btn primary" onclick="openAddAccountModal()">Add Account</button>
            <button class="btn ghost" onclick="refreshState()">Refresh</button>
          </div>
        </div>
        <div class="cards-grid">
          ${state.accounts.length ? state.accounts.map(accountCardHtml).join("") : emptyMsg("No accounts yet.")}
        </div>`;
    }

    function accountDetailHtml() {
      const account = state.accounts.find(a=>a.id===state.currentAccountId);
      if (!account) return `
        <div class="page-header"><div><div class="page-title">Account Not Found</div></div>
          <div class="header-actions"><button class="btn" onclick="showPage('accounts')">Back</button></div></div>
        ${emptyMsg("Account not found or removed.")}`;
      const ac = sortedConfigs().filter(c=>c.account_id===account.id);
      const accountLogs = state.logs.filter(e=>e.account_id===account.id).slice(0,40);
      const specialBtns = [];
      if (account.status==="awaiting_code")     specialBtns.push(`<button class="btn primary sm" onclick="openCodeModal('${account.id}')">Enter Code</button>`);
      if (account.status==="awaiting_password") specialBtns.push(`<button class="btn primary sm" onclick="openPasswordModal('${account.id}')">Enter Password</button>`);
      return `
        <div class="page-header">
          <div>
            <div class="page-title">${esc(account.name)}</div>
            <div class="page-sub">${esc(account.phone)} · ${esc(account.status)}</div>
          </div>
          <div class="header-actions">
            <button class="btn ghost" onclick="showPage('accounts')">← Back</button>
            <button class="btn" onclick="openTaskModal(null,'${account.id}')">Add Task</button>
            <button class="btn success" onclick="startAll('${account.id}')">▶ Start All</button>
            <button class="btn danger" onclick="stopAll('${account.id}')">■ Stop All</button>
            <button class="btn ghost" onclick="refreshAccount('${account.id}')">Refresh</button>
            <button class="btn danger" onclick="removeAccount('${account.id}')">Remove</button>
          </div>
        </div>

        <div class="two-col">
          <div class="card">
            <div class="card-title"><span class="card-title-dot"></span>Profile</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="mini-stat"><div class="ms-label">Phone</div><div style="font-size:13px;font-weight:700;">${esc(account.phone)}</div></div>
              <div class="mini-stat"><div class="ms-label">Status</div>${accountStatusBadge(account.status)}</div>
              <div class="mini-stat"><div class="ms-label">Created</div><div style="font-size:12px;">${esc(fmt(account.created_at))}</div></div>
              <div class="mini-stat"><div class="ms-label">Last Active</div><div style="font-size:12px;">${esc(fmt(account.last_activity))}</div></div>
            </div>
            ${account.error ? `<div class="error-box">${esc(account.error)}</div>` : ""}
            ${specialBtns.length ? `<div class="action-row">${specialBtns.join("")}</div>` : ""}
          </div>
          <div class="card">
            <div class="card-title"><span class="card-title-dot" style="background:var(--green)"></span>Statistics</div>
            <div class="mini-stats" style="grid-template-columns:repeat(2,1fr);">
              <div class="mini-stat"><div class="ms-label">Tasks</div><div class="ms-value">${ac.length}</div></div>
              <div class="mini-stat"><div class="ms-label">Running</div><div class="ms-value" style="color:var(--cyan);">${ac.filter(c=>c.task_running).length}</div></div>
              <div class="mini-stat"><div class="ms-label">Success</div><div class="ms-value" style="color:var(--green);">${ac.reduce((s,c)=>s+Number(c.success_count||0),0)}</div></div>
              <div class="mini-stat"><div class="ms-label">Errors</div><div class="ms-value" style="color:var(--red);">${ac.reduce((s,c)=>s+Number(c.error_count||0),0)}</div></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="toolbar" style="margin-bottom:12px;">
            <div class="card-title" style="margin:0;"><span class="card-title-dot"></span>Tasks</div>
            <div class="spacer"></div>
            <button class="btn sm" onclick="openTaskModal(null,'${account.id}')">Add Task</button>
            <button class="btn sm success" onclick="startAll('${account.id}')">▶ Start All</button>
            <button class="btn sm danger" onclick="stopAll('${account.id}')">■ Stop All</button>
          </div>
          <div class="table-wrap">
            <div class="table-head"><div>Task</div><div>Account</div><div>Target</div><div>Interval</div><div>State</div><div>Schedule</div><div>Stats</div><div>Actions</div></div>
            ${ac.length ? ac.map(taskRowHtml).join("") : emptyMsg("No tasks yet.")}
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="card-title-dot" style="background:var(--cyan)"></span>Account Logs</div>
          <div class="log-list">${accountLogs.length ? accountLogs.map(logItemHtml).join("") : emptyMsg("No logs yet.")}</div>
        </div>`;
    }

    // ── Tasks ──
    function taskRowHtml(cfg) {
      const acc = state.accounts.find(a=>a.id===cfg.account_id);
      const ssBtn = cfg.task_running
        ? `<button class="btn sm danger" onclick="stopTask('${cfg.id}')">■ Stop</button>`
        : `<button class="btn sm success" onclick="startTask('${cfg.id}')">▶ Start</button>`;
      return `
        <div class="table-row">
          <div><div class="cell-title">${esc(cfg.name)}</div><div class="cell-sub">kw: ${esc(cfg.action_keyword||"—")}</div></div>
          <div>${acc ? `<div class="cell-title" style="font-size:12px;">${esc(acc.name)}</div><div class="cell-sub">${esc(acc.phone)}</div>` : `<span class="badge danger">Missing</span>`}</div>
          <div><div class="cell-title" style="font-size:12px;">${esc(cfg.target_chat||"—")}</div><div class="cell-sub">${esc(cfg.bot_id||"—")}</div></div>
          <div><span style="font-size:13px;font-weight:700;">${esc(cfg.interval_minutes||0)}m</span></div>
          <div>${taskStateBadge(cfg)}</div>
          <div><div class="cell-sub">Last: ${esc(fmt(cfg.last_run))}</div><div class="cell-sub">Next: ${esc(fmt(cfg.next_run))}</div></div>
          <div><div class="cell-sub" style="color:var(--green);">✓ ${esc(cfg.success_count||0)}</div><div class="cell-sub" style="color:var(--red);">✗ ${esc(cfg.error_count||0)}</div></div>
          <div class="action-row right">
            ${ssBtn}
            <button class="btn sm" onclick="openTaskModal('${cfg.id}')">Edit</button>
            <button class="btn sm ghost" onclick="duplicateTask('${cfg.id}')">Copy</button>
            <button class="btn sm danger" onclick="deleteTask('${cfg.id}')">Del</button>
          </div>
        </div>`;
    }

    function tasksListHtml() {
      let cfgs = sortedConfigs();
      if (state.ui.taskAccountFilter !== "all") cfgs = cfgs.filter(c=>c.account_id===state.ui.taskAccountFilter);
      return cfgs.length ? cfgs.map(taskRowHtml).join("") : emptyMsg("No tasks found.");
    }
    function setTaskAccountFilter(v) { state.ui.taskAccountFilter=v; const el=document.getElementById("task-list"); if(el) el.innerHTML=tasksListHtml(); }

    function tasksHtml() {
      return `
        <div class="page-header">
          <div>
            <div class="page-title">Tasks</div>
            <div class="page-sub">${state.configs.length} saved tasks · parallel execution</div>
          </div>
          <div class="header-actions">
            <button class="btn primary" onclick="openTaskModal()">Add Task</button>
            <button class="btn" onclick="openImportModal()">Import</button>
            <button class="btn ghost" onclick="exportConfigs()">Export</button>
            <button class="btn success" onclick="startAll()">▶ Start All</button>
            <button class="btn danger" onclick="stopAll()">■ Stop All</button>
          </div>
        </div>
        <div class="card">
          <div class="toolbar" style="margin-bottom:12px;">
            <select style="max-width:300px;" onchange="setTaskAccountFilter(this.value)">
              ${accountOptions(state.ui.taskAccountFilter, true)}
            </select>
            <div class="spacer"></div>
            <span style="font-size:12px;color:var(--text-2);">${state.configs.length} tasks</span>
          </div>
          <div class="divider"></div>
          <div class="table-wrap">
            <div class="table-head"><div>Task</div><div>Account</div><div>Target</div><div>Interval</div><div>State</div><div>Schedule</div><div>Stats</div><div>Actions</div></div>
            <div id="task-list">${tasksListHtml()}</div>
          </div>
        </div>`;
    }

    // ── Logs ──
    function logItemHtml(entry) {
      const meta = [entry.account_id && accountName(entry.account_id), entry.config_id && configName(entry.config_id)].filter(Boolean).join(" · ");
      return `
        <div class="log-item">
          <div class="log-ts">${esc(entry.ts||"")}</div>
          <div>${levelBadge(entry.level)}</div>
          <div>
            <div class="log-msg">${esc(entry.message||"")}</div>
            ${meta ? `<div class="log-meta">${esc(meta)}</div>` : ""}
          </div>
        </div>`;
    }
    function logListHtml() {
      let logs = state.logs;
      if (state.ui.logLevel !== "all") logs = logs.filter(e=>String(e.level||"").toLowerCase()===state.ui.logLevel);
      if (state.ui.logAccount !== "all") logs = logs.filter(e=>e.account_id===state.ui.logAccount);
      logs = logs.slice(0,300);
      return logs.length ? logs.map(logItemHtml).join("") : emptyMsg("No logs match the filters.");
    }
    function setLogLevel(v)   { state.ui.logLevel=v;   const el=document.getElementById("log-list"); if(el) el.innerHTML=logListHtml(); }
    function setLogAccount(v) { state.ui.logAccount=v; const el=document.getElementById("log-list"); if(el) el.innerHTML=logListHtml(); }

    function logsHtml() {
      return `
        <div class="page-header">
          <div>
            <div class="page-title">Logs</div>
            <div class="page-sub">${state.logs.length} entries in memory</div>
          </div>
          <div class="header-actions">
            <button class="btn danger" onclick="clearLogs()">Clear</button>
            <button class="btn ghost" onclick="refreshState()">Refresh</button>
          </div>
        </div>
        <div class="card">
          <div class="toolbar" style="margin-bottom:12px;">
            <select style="max-width:160px;" onchange="setLogLevel(this.value)">
              <option value="all" ${state.ui.logLevel==="all"?"selected":""}>All Levels</option>
              <option value="info" ${state.ui.logLevel==="info"?"selected":""}>Info</option>
              <option value="warning" ${state.ui.logLevel==="warning"?"selected":""}>Warning</option>
              <option value="error" ${state.ui.logLevel==="error"?"selected":""}>Error</option>
            </select>
            <select style="max-width:280px;" onchange="setLogAccount(this.value)">
              ${accountOptions(state.ui.logAccount, true, "All Accounts")}
            </select>
          </div>
          <div class="divider"></div>
          <div id="log-list" class="log-list">${logListHtml()}</div>
        </div>`;
    }

    // ── Settings ──
    function settingsHtml() {
      const s = getSettings();
      return `
        <div class="page-header">
          <div><div class="page-title">Settings</div><div class="page-sub">Local panel preferences stored in your browser.</div></div>
        </div>
        <div class="card" style="max-width:600px;">
          <div class="card-title"><span class="card-title-dot"></span>Panel Settings</div>
          <form onsubmit="saveSettings(event)">
            <div class="field">
              <label>Refresh interval (ms)</label>
              <input name="poll_ms" type="number" min="1500" max="15000" step="500" value="${s.pollMs}" />
            </div>
            <div class="notice">Sessions and task configs are stored locally in <code>click_farm_data.json</code>. This panel is for private local use only.</div>
            <div class="modal-actions"><button class="btn primary" type="submit">Save Settings</button></div>
          </form>
        </div>`;
    }

    // ── Modals ──
    function openModal(html) {
      state.ui.paused = true;
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop" onclick="closeModal()">
          <div class="modal" onclick="event.stopPropagation()">${html}</div>
        </div>`;
    }
    function closeModal() {
      state.ui.paused = false;
      document.getElementById("modal-root").innerHTML = "";
    }

    function openAddAccountModal() {
      renderAddAccountModal("login");
    }
    function switchAddAccountMethod(method) {
      renderAddAccountModal(method);
    }
    function renderAddAccountModal(method) {
      const isLogin = method === "login";
      openModal(`
        <h2>Add Telegram Account</h2>
        <div class="modal-sub">${isLogin ? "Sessions are stored locally. A login code will be sent via Telegram." : "Paste a Telethon StringSession you already have. No code or 2FA is needed — this doesn't create a new Telegram login, it just reuses the one that string already represents. Phone is auto-detected."}</div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <button type="button" class="btn ${isLogin ? "primary" : "ghost"}" style="flex:1;" onclick="switchAddAccountMethod('login')">Full Login</button>
          <button type="button" class="btn ${!isLogin ? "primary" : "ghost"}" style="flex:1;" onclick="switchAddAccountMethod('string')">String Session</button>
        </div>
        ${isLogin ? `
        <form onsubmit="submitAddAccount(event)">
          <div class="form-2col">
            <div class="field"><label>Label</label><input name="name" placeholder="Optional label" /></div>
            <div class="field"><label>Phone</label><input name="phone" placeholder="+1234567890" required /></div>
            <div class="field"><label>api_id</label><input name="api_id" type="number" min="1" required /></div>
            <div class="field"><label>api_hash</label><input name="api_hash" required /></div>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="submit">Send Login Code</button>
          </div>
        </form>` : `
        <form onsubmit="submitImportAccount(event)">
          <div class="form-2col">
            <div class="field"><label>Label</label><input name="name" placeholder="Optional label" /></div>
            <div class="field"><label>api_id</label><input name="api_id" type="number" min="1" required /></div>
          </div>
          <div class="field"><label>api_hash</label><input name="api_hash" required /></div>
          <div class="field"><label>String Session</label><textarea name="session_string" rows="4" required style="width:100%;resize:vertical;font-family:monospace;font-size:12px;padding:8px;" placeholder="1BVtsO..."></textarea></div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="submit">Import Account</button>
          </div>
        </form>`}`);
    }
    async function submitAddAccount(e) {
      e.preventDefault();
      const f = e.target;
      try {
        const data = await api("/api/accounts","POST",{name:f.name.value.trim(),phone:f.phone.value.trim(),api_id:f.api_id.value.trim(),api_hash:f.api_hash.value.trim()});
        toast("Account added","success"); closeModal();
        if (data.account?.status==="awaiting_code")     openCodeModal(data.account.id);
        else if (data.account?.status==="awaiting_password") openPasswordModal(data.account.id);
        await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }
    async function submitImportAccount(e) {
      e.preventDefault();
      const f = e.target;
      try {
        await api("/api/accounts/import","POST",{name:f.name.value.trim(),api_id:f.api_id.value.trim(),api_hash:f.api_hash.value.trim(),session_string:f.session_string.value.trim()});
        toast("Account imported","success"); closeModal();
        await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }


    function openCodeModal(accountId) {
      const acc = state.accounts.find(a=>a.id===accountId);
      openModal(`
        <h2>Enter Telegram Code</h2>
        <div class="modal-sub">Code sent to ${esc(acc?.phone||"your account")}.</div>
        <form onsubmit="submitCode(event,'${accountId}')">
          <div class="field"><label>Code</label><input name="code" required autofocus /></div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="submit">Verify</button>
          </div>
        </form>`);
    }
    async function submitCode(e, accountId) {
      e.preventDefault();
      try {
        const data = await api(`/api/accounts/${accountId}/code`,"POST",{code:e.target.code.value.trim()});
        toast("Code verified","success"); closeModal();
        if (data.account?.status==="awaiting_password") openPasswordModal(accountId);
        await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }

    function openPasswordModal(accountId) {
      const acc = state.accounts.find(a=>a.id===accountId);
      openModal(`
        <h2>Two-Step Verification</h2>
        <div class="modal-sub">Enter the 2FA password for ${esc(acc?.phone||"this account")}.</div>
        <form onsubmit="submitPassword(event,'${accountId}')">
          <div class="field"><label>Password</label><input name="password" type="password" required autofocus /></div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="submit">Verify</button>
          </div>
        </form>`);
    }
    async function submitPassword(e, accountId) {
      e.preventDefault();
      try {
        await api(`/api/accounts/${accountId}/password`,"POST",{password:e.target.password.value});
        toast("Password verified","success"); closeModal(); await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }

    function openTaskModal(configId=null, presetAccountId=null) {
      if (!state.accounts.length) { toast("Add an account first","warning"); openAddAccountModal(); return; }
      state.ui.editingConfigId = configId;
      const cfg = configId ? state.configs.find(c=>c.id===configId)||{} : {};
      const selAcc = cfg.account_id || presetAccountId || state.accounts[0]?.id || "";
      openModal(`
        <h2>${configId ? "Edit Task" : "New Task"}</h2>
        <div class="modal-sub">Task settings are saved under the selected account.</div>
        <form onsubmit="submitTask(event)">
          <div class="form-2col">
            <div class="field"><label>Task Name</label><input name="name" value="${esc(cfg.name||"")}" required /></div>
            <div class="field"><label>Account</label><select name="account_id" required>${accountOptions(selAcc)}</select></div>
            <div class="field"><label>Target Chat</label><input name="target_chat" value="${esc(cfg.target_chat||"")}" placeholder="@chat or ID" required /></div>
            <div class="field"><label>Game Bot</label><input name="bot_id" value="${esc(cfg.bot_id||"")}" placeholder="@bot or ID" /></div>
            <div class="field"><label>Game Command</label><input name="command" value="${esc(cfg.command||"")}" placeholder="/game" required /></div>
            <div class="field"><label>Action Keyword</label><input name="action_keyword" value="${esc(cfg.action_keyword||"")}" placeholder="Start" required /></div>
            <div class="field"><label>Interval (minutes)</label><input name="interval_minutes" type="number" min="1" step="0.1" value="${esc(cfg.interval_minutes??30)}" required /></div>
            <div class="field"><label>Bot Response Timeout (s)</label><input name="response_timeout_seconds" type="number" min="5" value="${esc(cfg.response_timeout_seconds??90)}" /></div>
            <div class="field"><label>Second Click Delay (s)</label><input name="second_click_delay_seconds" type="number" min="0" value="${esc(cfg.second_click_delay_seconds??60)}" /></div>
            <div class="field"><div class="checkbox-row"><input id="task_enabled" name="enabled" type="checkbox" ${cfg.enabled!==false?"checked":""} /><label for="task_enabled">Enabled</label></div></div>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="submit">${configId?"Save Changes":"Create Task"}</button>
          </div>
        </form>`);
    }
    async function submitTask(e) {
      e.preventDefault();
      const f = e.target, configId = state.ui.editingConfigId;
      const payload = {
        name: f.name.value.trim(), account_id: f.account_id.value,
        target_chat: f.target_chat.value.trim(), bot_id: f.bot_id.value.trim(),
        command: f.command.value.trim(), action_keyword: f.action_keyword.value.trim(),
        interval_minutes: Number(f.interval_minutes.value||30),
        response_timeout_seconds: Number(f.response_timeout_seconds.value||90),
        second_click_delay_seconds: Number(f.second_click_delay_seconds.value||60),
        enabled: f.querySelector("#task_enabled").checked
      };
      try {
        if (configId) { await api(`/api/configs/${configId}`,"PUT",payload); toast("Task updated","success"); }
        else          { await api("/api/configs","POST",payload); toast("Task created","success"); }
        closeModal(); await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }

    function openImportModal() {
      openModal(`
        <h2>Import Tasks</h2>
        <div class="modal-sub">Paste a JSON array of configs, or an object with a configs key. Optionally assign all to one account.</div>
        <form onsubmit="submitImport(event)">
          <div class="field"><label>Optional Target Account</label><select name="account_id"><option value="">Keep values from JSON</option>${accountOptions("")}</select></div>
          <div class="field"><label>JSON</label><textarea name="text" placeholder='[{"name":"Task 1",...}]' required></textarea></div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="submit">Import</button>
          </div>
        </form>`);
    }
    async function submitImport(e) {
      e.preventDefault();
      const text = e.target.text.value.trim(), accountId = e.target.account_id.value;
      if (!text) { toast("Paste JSON first","warning"); return; }
      let parsed;
      try { parsed = JSON.parse(text); } catch { toast("Invalid JSON","error"); return; }
      let body;
      if (Array.isArray(parsed)) body = {configs:parsed};
      else if (parsed && typeof parsed==="object") body = parsed;
      else { toast("Unsupported JSON structure","error"); return; }
      if (accountId) body.account_id = accountId;
      try {
        const data = await api("/api/import","POST",body);
        toast(`Imported ${data.imported??0} configs`,"success"); closeModal(); await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }

    // ── API actions ──
    async function exportConfigs() {
      try {
        const data = await api("/api/export");
        const blob = new Blob([JSON.stringify(data.configs||[],null,2)],{type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href=url; a.download="click_farm_configs.json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        toast("Configs exported","success");
      } catch(err) { toast(err.message,"error"); }
    }
    async function startAll(accountId=null) {
      try {
        const body = accountId ? {account_id:accountId} : {};
        const data = await api("/api/start-all","POST",body);
        toast(`Started: ${data.started??0}, skipped: ${data.skipped??0}`,"success");
        await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }
    async function stopAll(accountId=null) {
      try {
        const body = accountId ? {account_id:accountId} : {};
        const data = await api("/api/stop-all","POST",body);
        toast(`Stopped: ${data.stopped??0}`,"success");
        await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }
    async function startTask(configId) {
      try { await api(`/api/configs/${configId}/start`,"POST",{}); toast("Task started","success"); await refreshState(); }
      catch(err) { toast(err.message,"error"); }
    }
    async function stopTask(configId) {
      try { await api(`/api/configs/${configId}/stop`,"POST",{}); toast("Task stopped","success"); await refreshState(); }
      catch(err) { toast(err.message,"error"); }
    }
    async function duplicateTask(configId) {
      try { await api(`/api/configs/${configId}/duplicate`,"POST",{}); toast("Task duplicated","success"); await refreshState(); }
      catch(err) { toast(err.message,"error"); }
    }
    async function deleteTask(configId) {
      if (!confirm("Delete this task?")) return;
      try { await api(`/api/configs/${configId}`,"DELETE"); toast("Task deleted","success"); await refreshState(); }
      catch(err) { toast(err.message,"error"); }
    }
    async function refreshAccount(accountId) {
      try { await api(`/api/accounts/${accountId}/refresh`,"POST",{}); toast("Account refreshed","success"); await refreshState(); }
      catch(err) { toast(err.message,"error"); }
    }
    async function removeAccount(accountId) {
      if (!confirm("Remove this account and all its tasks?")) return;
      try {
        await api(`/api/accounts/${accountId}`,"DELETE"); toast("Account removed","success");
        if (state.currentAccountId===accountId) { state.currentAccountId=null; state.currentPage="accounts"; }
        await refreshState();
      } catch(err) { toast(err.message,"error"); }
    }
    async function clearLogs() {
      if (!confirm("Clear all logs?")) return;
      try { await api("/api/logs/clear","POST",{}); toast("Logs cleared","success"); await refreshState(); }
      catch(err) { toast(err.message,"error"); }
    }

    refreshState().finally(()=>startPolling());
  </script>
</body>
</html>
